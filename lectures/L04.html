<header class="topbar"></header>
<div class="layout">
<main class="main" id="mainContent">
  <div class="hero">
    <div class="badge bili">YT 录像</div>
    <div class="badge self">自测/闪卡自编</div>
    <h1>📚 L04 · Tool Use & Function Calling</h1>
    <p class="badge"><a href="https://youtu.be/s0S38lz6O7M" target="_blank" rel="noopener">YouTube</a> · <a href="https://web.stanford.edu/class/cs329z/slides/lecture04.pdf" target="_blank" rel="noopener">Slides PDF</a> · <a href="https://cs329z.stanford.edu" target="_blank" rel="noopener">官方站</a></p>
    <p class="muted">日期（课表）：Mon Oct 5 · 模块：Building Blocks</p>
    <div class="toolbar">
      <button class="btn ok" id="markDone">标记本讲已完成</button>
      <a class="btn secondary" href="../progress.html">查看进度</a>
</div>
    <div class="progress-bar" style="margin-top:12px"><i id="doneBar" style="width:0%"></i></div>
  </div>
  <nav class="toc sticky-toc" id="pageToc" aria-label="本节目录"></nav>
  <section class="lecture-content" aria-label="章节正文"><div class="body content" id="lectureBody"></div></section>
  <details class="section" id="selfCheck"><summary>自测与闪卡（自编）</summary><div class="body"><section><h3>自测问答</h3><div id="quizRoot"></div></section><section><h3>概念闪卡</h3><div id="flashRoot"></div></section></div></details>
</main>
</div>
<script src="../data/lectures/L04.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const id='L04';
  const host=document.getElementById('lectureBody');
  const md=(window.LECTURE_MD||{})[id]||'';
  if(typeof renderMarkdown==='function')renderMarkdown(md,host);
  const toc=document.getElementById('pageToc');
  const secs=[...host.querySelectorAll('h2, h3')].filter(h=>!['自测问答','概念闪卡'].includes(h.textContent));
  toc.innerHTML='<strong>本页目录</strong>'+secs.map((h,i)=>{const sid='sec-'+i;h.id=sid;return '<a href="#'+sid+'">'+h.textContent+'</a>'}).join('');
  if(window.CS329Z_VIZ){try{CS329Z_VIZ.inject(id, host);}catch(e){console.warn('viz',e);}}
  host.querySelectorAll('details.section').forEach(d=>{
    d.addEventListener('toggle',()=>{
      if(!d.open) return;
      if(window.mermaid){try{mermaid.run({nodes:d.querySelectorAll('.mermaid')});}catch(e){}}
      if(window.renderMathInElement){
        d.querySelectorAll('.content').forEach(el=>renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}));
      }
    });
  });
  if(window.CS329Z_bindSlideLightbox) CS329Z_bindSlideLightbox();
  mountQuiz(document.getElementById('quizRoot'), id, (QUIZZES||{})[id]);
  mountFlashcards(document.getElementById('flashRoot'), id, (FLASHCARDS||{})[id]||[]);
  document.getElementById('markDone').onclick=()=>{
    CS329Z.markLectureDone(id);
    document.getElementById('doneBar').style.width='100%';
    alert('已标记完成（localStorage）');
  };
  const p=CS329Z.loadProgress();
  if(p.lectures && p.lectures[id] && p.lectures[id].done) document.getElementById('doneBar').style.width='100%';
});
</script>
</body></html>
