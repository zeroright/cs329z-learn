<h1>隐私政策</h1>
<p>CS329Z 自学站是一个本地化的课程自学应用。</p>
<h2>数据收集</h2>
<p><b>我们不收集任何个人数据。</b></p>
<ul>
<li>无账号注册</li>
<li>无分析/广告 SDK</li>
<li>无服务器端数据上传</li>
<li>学习进度、笔记、掌握度评分仅保存在本机 localStorage</li>
</ul>
<h2>外部链接</h2>
<p>应用内提供指向 YouTube、GitHub、arXiv 等外部网站的链接。点击后跳转到系统浏览器，相关网站有自己的隐私政策。</p>
<h2>数据删除</h2>
<p>删除应用即可清除全部本地数据。</p>
<p>联系：通过 GitHub Issues（zeroright/cs329z-learn）反馈。</p>
